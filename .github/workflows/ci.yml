name: Task Manager CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: task_manager_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d task_manager_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JWT_SECRET: test-manager-secret-for-ci-only-1234567890
      BCRYPT_ROUNDS: '4'
      DATABASE_URL: postgresql+asyncpg://app:ci-password@localhost:5432/task_manager_test
      TEST_DATABASE_URL: postgresql+asyncpg://app:ci-password@localhost:5432/task_manager_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: pytest -q
      - run: docker build -t task-manager-api:test .
